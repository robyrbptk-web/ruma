<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>Admin Dashboard - RUMA</title>
  <link rel="icon" href="./logoruma.png" type="image/png">
  <style>
    :root{--ink:#17181b;--muted:#747b86;--line:#e7e9ee;--soft:#f6f7f9;--blue:#2878f0;--red:#c74355;--green:#16865b}
    *{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}
    .top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px;font-weight:850}.brand img{width:90px;height:38px;object-fit:contain;object-position:left}.admin-badge{font-size:10px;font-weight:800;color:var(--blue);background:#edf4ff;padding:6px 8px;border-radius:999px}
    .top-actions{display:flex;gap:8px}.top-actions a,.top-actions button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 12px;color:var(--ink);font-size:12px;font-weight:750;text-decoration:none}.top-actions .danger{color:var(--red)}
    .layout{max-width:1240px;margin:auto;padding:26px 24px}.hero{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:20px}.hero h1{margin:0;font-size:28px;letter-spacing:-.8px}.hero p{color:var(--muted);font-size:13px;margin:7px 0 0}.primary{border:0;border-radius:10px;background:var(--ink);color:#fff;padding:11px 14px;font-size:12px;font-weight:800}.secondary{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 10px;font-size:11px;font-weight:750}.danger{color:var(--red)}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px}.metric small{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;font-size:25px;margin-top:8px}.tabs{display:flex;gap:8px;margin-bottom:12px;overflow:auto}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;color:var(--muted);font-size:12px;font-weight:800;white-space:nowrap}.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}.panel h2{font-size:16px;margin:0 0 13px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}.table th,.table td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}.table td:last-child,.table th:last-child{text-align:right}.user{display:flex;align-items:center;gap:8px}.avatar{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#e8efff;color:#2859a8;font-size:11px;font-weight:800}.muted{color:var(--muted)}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--muted);font-size:10px;font-weight:800}.pill.admin{background:#edf4ff;color:var(--blue)}.pill.blocked{background:#fff0f1;color:var(--red)}.actions{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}.empty{color:var(--muted);font-size:13px;padding:24px 0;text-align:center}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);opacity:0;background:#17181b;color:#fff;border-radius:999px;padding:11px 15px;font-size:12px;transition:.2s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}.login{max-width:420px;margin:100px auto;padding:24px}.login h1{margin:0 0 8px}.login p{color:var(--muted);font-size:13px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;font-weight:800}.field input{border:1px solid var(--line);border-radius:10px;padding:11px 12px}.error{color:var(--red);font-size:12px;min-height:18px}.hidden{display:none!important}
    @media(max-width:760px){.top{padding:0 14px}.top-actions a{display:none}.layout{padding:18px 12px}.hero{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric strong{font-size:20px}}
    .toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:-3px 0 12px}.toolbar input{min-width:220px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:12px}.toolbar select,.actions select{border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 9px;font-size:11px}.pill.moderator{background:#f1ebff;color:#6844aa}
  </style>
</head>
<body>
  <header class="top"><a class="brand" href="./index.html"><img src="./logoruma.png" alt="RUMA"><span>Admin Dashboard</span><span class="admin-badge">ADMIN</span></a><div class="top-actions"><a href="./index.html">Kembali</a><button id="logoutButton" class="danger">Keluar</button></div></header>
  <main id="app" class="layout"><section class="login panel"><h1>Masuk sebagai admin</h1><p>Gunakan akun admin RUMA untuk membuka panel pengelolaan.</p><form id="fallbackLogin"><div class="field"><label>Username</label><input id="fallbackUsername" value="roby" required></div><div class="field"><label>Password</label><input id="fallbackPassword" type="password" required></div><button class="primary" style="width:100%">Masuk</button></form></section></main>
  <div id="toast" class="toast" role="status"></div>
  <script src="./admin.js"></script>
</body>
</html>
